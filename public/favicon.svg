<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Document Body with Folded Top Right Corner -->
    <path d="M18 12 H36 L46 22 V50 C46 51.1 45.1 52 44 52 H18 C16.9 52 16 51.1 16 50 V14 C16 12.9 16.9 12 18 12 Z" fill="#FFFFFF"/>
    
    <!-- Folded Corner Flap -->
    <path d="M36 12 V20 C36 21.1 36.9 22 38 22 H46 Z" fill="#E0E7FF"/>
    
    <!-- Document Content Lines -->
    <rect x="22" y="27" width="16" height="3" rx="1.5" fill="#4F46E5"/>
    <rect x="22" y="34" width="18" height="3" rx="1.5" fill="#94A3B8"/>
    <rect x="22" y="41" width="12" height="3" rx="1.5" fill="#CBD5E1"/>
  </g>

  <!-- AI Sparkle Accent in Bottom Right -->
  <path d="M48 36 C48 40 45 43 41 43 C45 43 48 46 48 50 C48 46 51 43 55 43 C51 43 48 40 48 36 Z" fill="url(#sparkGrad)"/>
  <circle cx="53" cy="35" r="1.5" fill="#FDE047"/>
</svg>
